<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#001529"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#0077b6"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="32" fill="url(#bg)"/>
  <!-- outer glow ring -->
  <circle cx="96" cy="96" r="68" fill="none" stroke="rgba(0,180,216,0.08)" stroke-width="2"/>
  <!-- main circle -->
  <circle cx="96" cy="96" r="52" fill="none" stroke="url(#glow)" stroke-width="4"/>
  <!-- inner dot -->
  <circle cx="96" cy="96" r="9" fill="#00b4d8"/>
  <circle cx="96" cy="96" r="4" fill="#00ff88"/>
  <!-- connection lines - top -->
  <path d="M96 96 L96 40" stroke="#00b4d8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <circle cx="96" cy="36" r="3" fill="#00ff88"/>
  <!-- bottom -->
  <path d="M96 96 L96 152" stroke="#00b4d8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <circle cx="96" cy="156" r="3" fill="#00ff88"/>
  <!-- left -->
  <path d="M96 96 L40 96" stroke="#00b4d8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <circle cx="36" cy="96" r="3" fill="#00ff88"/>
  <!-- right -->
  <path d="M96 96 L152 96" stroke="#00b4d8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <circle cx="156" cy="96" r="3" fill="#00ff88"/>
  <!-- brand text -->
  <text x="96" y="178" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="1">İSTANBUL TELEKOM</text>
</svg>